# Reviewed OSV exceptions for this Expo SDK 53 app. Each entry has a reason and an expiry.
# Reviewed 2026-10-23 when the repo moved to platform-ci-workflows v1.1.1 (ci-node + security);
# same exception set as the canonical template bookchaowalit-mobile/community-hub-mobile.
# Fixable advisories were fixed instead: vitest 3.2 -> 4.1.12 plus `npm audit fix` (non-breaking).
# The rest sit inside Expo SDK 53 / React Native 0.79 tooling and cannot move without an
# SDK major bump. Re-check on the next SDK upgrade or expiry.

# Build-time only: metro (bundler) reads the dimensions of this repo's own committed image
# assets. image-size 2.x changes the export shape metro 0.82 requires, so an override breaks
# bundling. Not shipped in the app bundle.
[[IgnoredVulns]]
id = "GHSA-5p2g-fcmc-qvqq"
ignoreUntil = 2027-01-22
reason = "image-size JXL/HEIF infinite loop; build-time only via metro on our own assets; 2.0.3 breaks metro 0.82 (SDK 53)."

[[IgnoredVulns]]
